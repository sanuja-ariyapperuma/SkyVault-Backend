services:
  mysql:
    image: mysql:8.4
    container_name: skyvault_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skyvault_dev}
      MYSQL_USER: ${MYSQL_USER:-skyvault_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skyvault_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - skyvault_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyvault_api
    env_file:
      - src/SkyVault.WebApi/.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5000
      - MYSQL_USER=${MYSQL_USER:-skyvault_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-skyvault_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-skyvault_dev}
      - MYSQL_HOST=skyvault_mysql
      - MYSQL_PORT=3306
      - DB_CONNECTION_STRING=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-skyvault_dev};User=${MYSQL_USER:-skyvault_user};Password=${MYSQL_PASSWORD:-skyvault_pass};
      - AZUREAD__INSTANCE=${AZUREAD__INSTANCE}
      - AZUREAD__TENANTID=${AZUREAD__TENANTID}
      - AZUREAD__CLIENTID=${AZUREAD__CLIENTID}
      - AZUREAD__AUDIENCE=${AZUREAD__AUDIENCE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - LOGGING__FILEPATH=${LOGGING__FILEPATH:-/app/logs/app.log}
      - AUTHORIZATION__APIKEY=${AUTHORIZATION__APIKEY:-dev-api-key-12345}
      - AZUREAPPINSIGHT__INSTRUMENTKEY=${AZUREAPPINSIGHT__INSTRUMENTKEY:-}
      - AZURE_FUNCTION_BASE_URL=${AZURE_FUNCTION_BASE_URL:-}
    ports:
      - "8080:5000"
      - "8443:7199"
    volumes:
      - ./logs:/app/logs
      - ./https:/https
    networks:
      - skyvault_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
    driver: local

networks:
  skyvault_network:
    driver: bridge
